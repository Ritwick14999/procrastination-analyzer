name: CI

on:
  push:
    branches: [main, improvement]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,app]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,app]"
      - name: Run tests with coverage
        run: pytest --cov=procrastination_analyzer --cov-report=xml --cov-report=term-missing
      - name: Enforce coverage floor
        run: coverage report --fail-under=85
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,app]"
      - name: CLI analyze on the packaged sample
        run: |
          procrastination-analyzer analyze \
            src/procrastination_analyzer/data/sample_commits.csv --format json
      - name: Simulate a cohort
        run: procrastination-analyzer simulate -n 2 --days 40 -o /tmp/cohort.csv
      - name: Analyse the simulated cohort
        run: procrastination-analyzer analyze /tmp/cohort.csv --column timestamp
      - name: Train a risk model
        run: procrastination-analyzer train -n 40 -o /tmp/model.joblib
      - name: Score using the trained model
        run: |
          procrastination-analyzer analyze \
            src/procrastination_analyzer/data/sample_commits.csv --model /tmp/model.joblib
      - name: Cross-validated evaluation
        run: procrastination-analyzer evaluate -n 40 --folds 3 --patterns
      - name: Streamlit app imports cleanly
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('src/procrastination_analyzer/ui/app.py').read_text())"
